<VirtualHost *:8080>
    # Behind Cloudflare and the ingress, Apache only sees http on 8080. Without a canonical name,
    # its own redirects (e.g. /app to /app/) leak http://team20.xtradot.co:8080 to the browser.
    ServerName https://team20.xtradot.co:443
    UseCanonicalName On
    DocumentRoot /var/www/html/public
    # The Android app is a download, not a page
    AddType application/vnd.android.package-archive .apk
    AddType text/vtt .vtt
    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # Real files (the website in public/app) are served directly; everything else goes to index.php
        FallbackResource /index.php
    </Directory>
    # Pass Kubernetes env vars (MODE, DB_DSN, GATEWAY_KEY, ...) through to PHP
    PassEnv MODE DB_DSN DB_USER DB_PASS GATEWAY_KEY BANK_BASE_URL MAAS_BASE_URL MAAS_MODEL PUBLIC_BASE_URL WEBHOOK_URL WEBHOOK_SECRET JWT_SECRET ALLOWED_ORIGINS DEMO_PASSWORD
    # Optional: unset variables are simply absent in PHP
    PassEnv SMS_PROVIDER
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
